<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <link 
      rel="stylesheet" 
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/styles.css">
   
</head>
<body>
    <header>
        <img src="/static/assets/header.png" alt="Groupie Tracker" />
        <div class="search-wrapper">
            <div class="search-bar">
              <input id="search" type="search" placeholder="🔍 Start typing to search...">
              
              <div class="clear-btn" onclick="clearText()">×</div>
            </div>
            <button id="search-btn" class="search-btn">Search</button>
            <div class="search-container">
              <div class="search-display"></div> <!-- Suggestions will appear here -->
            </div>
          </div>
          
    </header>
    
    <div id="mapid"></div>
    <main id="band-container">
        <!-- Cards will be dynamically injected here -->
    </main>

    <script>
        window.artistData = [
        {{range $index, $artist := .Artists}}{{if $index}}, {{end}}{
            name: "{{.Name}}",
            image: "{{.Image}}",
            firstAlbum: "{{.FirstAlbum}}",
            creationDate: {{.CreationDate}},
            members: [{{range $i, $member := .Members}}{{if $i}}, {{end}}{{printf "%q" $member}}{{end}}],
            dates: [{{range $i, $date := .Dates}}{{if $i}}, {{end}}{{printf "%q" $date}}{{end}}],
            locations: [{{range $i, $location := .Locations}}{{if $i}}, {{end}}{{printf "%q" $location}}{{end}}],
            events: {
                {{- $first := true -}}
                {{- range $key, $value := .Relation -}}
                    {{- if not $first}}, {{end -}}
                    {{- $first = false -}}
                    {{printf "%q: %q" $key $value}}
                {{- end -}}
            }
        }{{end}}
        ];
    </script>
      <script 
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
      crossorigin=""
    ></script>
    <script src="/static/app.js" defer></script>
    
    <footer>
        <p>Groupie Tracker - All Rights Reserved &copy; 2024</p>
    </footer>
</body>
</html>
